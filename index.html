<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Empundu Field Data Platform</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: fixed instrument rail on the left, scrolling work surface on the right;
   rail becomes a horizontal strip above the surface at phone width. */
:root{
  --bg:#f3f5f2; --surface:#fcfdfb; --surface-2:#edf0ec; --sunk:#e7ebe6;
  --ink:#0e1310; --ink-2:#4b544e; --muted:#737d77; --line:#d9e0d8; --line-2:#c3ccc2;
  --accent:#1f4e2c; --accent-ink:#ffffff; --accent-soft:#e3eee6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --rail:214px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0e0c; --surface:#151a17; --surface-2:#1c221e; --sunk:#101513;
  --ink:#e9ede9; --ink-2:#b3bdb6; --muted:#8b958e; --line:#262e28; --line-2:#333d36;
  --accent:#6bbd86; --accent-ink:#06130b; --accent-soft:#17291d;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b0e0c; --surface:#151a17; --surface-2:#1c221e; --sunk:#101513;
  --ink:#e9ede9; --ink-2:#b3bdb6; --muted:#8b958e; --line:#262e28; --line-2:#333d36;
  --accent:#6bbd86; --accent-ink:#06130b; --accent-soft:#17291d;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-0.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100vh;overflow:auto}
.brand{padding:18px 16px 14px;border-bottom:1px solid var(--line)}
.brand .mark{display:flex;align-items:center;gap:9px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.brand .name{font-weight:700;font-size:14.5px;letter-spacing:-0.015em}
.brand .sub{margin-top:5px;font-size:11px;color:var(--muted);letter-spacing:.02em}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;
  padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:13.5px}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav .ic{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav .ct{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.railfoot{padding:11px 16px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.stat{display:flex;align-items:center;gap:7px}
.led{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.led.on{background:var(--good)} .led.off{background:var(--crit)}

.main{min-width:0;padding:24px 28px 56px}
.head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head h1{font-size:21px}
.head p{margin:5px 0 0;color:var(--muted);font-size:13px;max-width:64ch}
.head .spacer{flex:1;min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.grid{display:grid;gap:12px}
.banner{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border-radius:9px;
  background:var(--accent-soft);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);margin-bottom:18px}
.banner b{color:var(--ink)}
.banner.warnbox{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border-color:color-mix(in srgb,var(--warn) 34%,var(--line))}
.banner.okbox{background:color-mix(in srgb,var(--good) 10%,var(--surface));border-color:color-mix(in srgb,var(--good) 30%,var(--line))}
.banner.badbox{background:color-mix(in srgb,var(--crit) 10%,var(--surface));border-color:color-mix(in srgb,var(--crit) 32%,var(--line))}

.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 15px;
  font-weight:600;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.07)}
.btn[disabled],.btn.off{opacity:.42;cursor:not-allowed;filter:none;pointer-events:none}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:7px}
:is(button,input,select,textarea,a):focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.seg{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px}
.seg button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;
  font-size:12.5px;cursor:pointer;color:var(--ink-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

/* collect cards */
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(286px,1fr));gap:12px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;
  display:flex;flex-direction:column;gap:9px}
.tool .top{display:flex;align-items:baseline;gap:9px}
.tool .badge{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent-ink);
  background:var(--accent);padding:2px 7px;border-radius:5px;flex:0 0 auto}
.tool h3{font-size:14px;flex:1;min-width:0}
.tool .n{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.tool .row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
a.tool{text-decoration:none;color:inherit;transition:border-color .12s,transform .12s,box-shadow .12s}
a.tool:hover{border-color:var(--accent);transform:translateY(-2px);
  box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 16%,transparent)}
a.tool:active{transform:translateY(0)}
.tool .go{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--accent)}
.tool .go svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool.pending{opacity:.72;border-style:dashed}
.tool.pending .go{color:var(--muted);font-weight:500}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:11px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.tile .k{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.tile .v{font-size:25px;font-weight:600;letter-spacing:-0.025em;margin-top:5px;line-height:1.1}
.tile .n{font-size:11.5px;color:var(--muted);margin-top:3px}

.ind{display:grid;gap:10px}
.ind-row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;
  display:grid;grid-template-columns:40px minmax(0,1fr) 128px;gap:14px;align-items:center}
.ind-ref{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.ind-name{font-size:13.5px;font-weight:500;line-height:1.35}
.ind-target{font-size:11.5px;color:var(--muted);margin-top:3px}
.ind-val{text-align:right}
.ind-num{font-size:19px;font-weight:600;letter-spacing:-0.02em}
.ind-of{font-size:11.5px;color:var(--muted);margin-top:1px}
.track{grid-column:1/-1;height:7px;border-radius:4px;background:var(--sunk);overflow:hidden}
.fill{height:100%;border-radius:4px;background:var(--s1)}
.fill.zero{background:var(--line-2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid}
.pill.none{color:var(--muted);border-color:var(--line-2);background:var(--surface-2)}
.pill.go{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent);background:color-mix(in srgb,var(--good) 11%,transparent)}
.pill.mid{color:var(--serious);border-color:color-mix(in srgb,var(--serious) 44%,transparent);background:color-mix(in srgb,var(--serious) 12%,transparent)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-height:66vh}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surface-2);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
  font-weight:700;position:sticky;top:0;z-index:1}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
td.extra,th.extra{color:var(--muted)}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input[type=search],.toolbar select{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;
  padding:7px 11px;font-size:13px}
.toolbar input[type=search]{min-width:170px;flex:1;max-width:300px}

.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:30px 22px;text-align:center;color:var(--muted);background:var(--surface)}
.empty b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:5px;font-weight:600}
.empty p{margin:0 auto;max-width:48ch;font-size:12.5px}

.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px}
.chart h3{font-size:13.5px;margin-bottom:2px}
.chart .cap{font-size:11.5px;color:var(--muted);margin-bottom:13px}
.bars{display:grid;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(96px,36%) minmax(0,1fr) 62px;gap:11px;align-items:center}
.bar-lab{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:15px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px}
.bar-val{font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}

.note{font-size:12px;color:var(--muted);margin-top:11px;line-height:1.55}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{font-family:var(--mono);font-size:11px;background:var(--sunk);border:1px solid var(--line);
  border-radius:5px;padding:2px 7px;color:var(--ink-2)}
.chip.bad{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 13%,transparent)}
.prog{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:9px}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.steps{counter-reset:s;display:grid;gap:7px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding-left:26px;font-size:12.5px;color:var(--ink-2)}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:18px;height:18px;border-radius:50%;
  background:var(--accent-soft);color:var(--ink);font-size:10.5px;font-weight:700;display:grid;place-items:center}

@media (max-width:860px){
  :root{--rail:100%}
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;overflow-x:auto;padding:8px;gap:4px}
  .nav button{white-space:nowrap;width:auto}
  .nav .ct{display:none}
  .railfoot{flex-direction:row;gap:14px;flex-wrap:wrap}
  .main{padding:18px 16px 48px}
  .ind-row{grid-template-columns:34px minmax(0,1fr);row-gap:9px}
  .ind-val{grid-column:2;text-align:left;display:flex;align-items:baseline;gap:8px}
  .ind-of{margin-top:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="shell">
  <aside class="rail">
    <div class="brand">
      <div class="mark"><span class="dot"></span><span class="name">Empundu Field Data</span></div>
      <div class="sub">Environmental Hub Uganda &middot; GEF SGP</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="railfoot">
      <div class="stat"><span class="led" id="led"></span><span id="conn">Connecting&hellip;</span></div>
      <div class="stat" id="whoami">&nbsp;</div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

/* ===== indicators ===== */
function knowScore(r){
  const direct = clean(r.score);
  if (direct !== null) return direct;
  const q=["q1","q2","q3","q4","q5","q6","q7","q8"].map(k=>r[k]);
  if (q.some(v=>v==null||v==="")) return null;
  return q.filter(v=>Number(v)===1).length;      // only code 1 is correct
}
function knowledgeImprovement(){
  const by=new Map();
  rowsOf("knowledge").forEach(r=>{
    const k=(r.participant||"").trim().toLowerCase(); if(!k) return;
    const s=knowScore(r); if(s===null) return;
    const e=by.get(k)||{};
    if(r.stage==="baseline") e.base=s;
    if(r.stage==="endline")  e.end=s;
    by.set(k,e);
  });
  let paired=0,improved=0;
  by.forEach(v=>{ if(v.base!=null&&v.end!=null){paired++; if(v.end>v.base)improved++;} });
  return {paired,improved,rate:paired?improved/paired:null};
}
function indicatorValue(ref){
  const I=rowsOf("institutions"), S=rowsOf("sites"), V=rowsOf("vslas"), K=rowsOf("knowledge");
  switch(ref){
    case "1.1": return I.filter(r=>Number(r.installed)===1).length;
    case "1.2": {
      const done=I.filter(r=>clean(r.units_now)!==null&&clean(r.f3_units)!==null);
      if(!done.length) return null;
      const base=done.reduce((a,r)=>a+clean(r.f3_units),0);
      const now =done.reduce((a,r)=>a+clean(r.units_now),0);
      return base>0?Math.max(0,(1-now/base)*100):null;
    }
    case "1.3": return I.reduce((a,r)=>a+(clean(r.trained)||0),0);
    case "1.4": return S.reduce((a,r)=>a+(clean(r.planted)||0),0);
    case "1.5": return S.filter(r=>clean(r.planted)).reduce((a,r)=>a+(clean(r.hectares)||0),0);
    case "1.6": return V.filter(r=>r.status==="active"||r.status==="formed")
                        .reduce((a,r)=>a+(clean(r.households)||0),0);
    case "1.7": return V.reduce((a,r)=>a+(clean(r.enterprises)||0),0);
    case "1.8": return new Set(K.filter(r=>r.participant).map(r=>(r.participant||"").trim().toLowerCase())).size;
    case "1.9": return manual.ambassadors||0;
  }
  return null;
}

/* ===== CSV ===== */
function detectDelim(line){
  const counts={",":0,";":0,"\t":0}; let q=false;
  for(const ch of line){ if(ch==='"') q=!q; else if(!q&&ch in counts) counts[ch]++; }
  return Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
}
function parseCsv(text){
  text=text.replace(/^﻿/,"");
  const firstLine=text.slice(0, text.indexOf("\n")<0?text.length:text.indexOf("\n"));
  const d=detectDelim(firstLine);
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    } else if(c==='"'){ q=true; }
    else if(c===d){ row.push(cell); cell=""; }
    else if(c==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else if(c!=="\r"){ cell+=c; }
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}
const shortCol = c => { const s=String(c||"").trim(); const i=s.lastIndexOf("/"); return i<0?s:s.slice(i+1); };

function mapRows(key, rows){
  const header=rows[0].map(shortCol);
  const known=fieldMap[key];
  const SYS=new Set(["start","end","today","deviceid","username","simserial","phonenumber",
    "subscriberid","instanceID","instanceName","formhub","uuid","__version__","meta"]);
  const matched=[], unmatched=[];
  header.forEach(h=>{ if(known[h]) matched.push(h); else if(h&&!/^_/.test(h)&&!SYS.has(h)) unmatched.push(h); });
  const out=[];
  for(let i=1;i<rows.length;i++){
    const rec={}; const raw=rows[i];
    header.forEach((h,j)=>{
      let v=raw[j]; if(v==null) return; v=String(v).trim(); if(v==="") return;
      const f=known[h];
      if(f && (f.t==="sel"||f.t==="multi") && f.o && f.o.length){
        // accept either the stored code or the visible label
        const hit=f.o.find(o=>String(o[0])===v) || f.o.find(o=>String(o[1]).toLowerCase()===v.toLowerCase());
        v = hit ? hit[0] : v;
      }
      if(f && f.t==="num"){ const n=Number(v); if(Number.isFinite(n)) v=n; }
      rec[h]=v;
    });
    if(Object.keys(rec).length) out.push(rec);
  }
  return {records:out, matched, unmatched, header};
}
function docIdFor(rec, i){
  let id = rec._uuid || rec["meta/instanceID"] || rec.instanceID || rec._id || "";
  id = String(id).replace(/^uuid:/,"").replace(/[^A-Za-z0-9_\-.~:@+]/g,"");
  if(id.length>=8) return id.slice(0,120);
  let h=5381; const s=JSON.stringify(rec);
  for(let j=0;j<s.length;j++) h=((h<<5)+h+s.charCodeAt(j))>>>0;
  return "r"+h.toString(36)+"-"+i;
}

  if(canWrite===false||!ready) fi.disabled=true;
  fi.onchange=()=>{
    const f=fi.files&&fi.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const rows=parseCsv(String(rd.result));
        if(rows.length<2){ importMsg="That file has a header but no data rows."; staged=null; }
        else { staged=mapRows(importSet,rows); staged.filename=f.name; importMsg=""; }
      }catch(e){ staged=null; importMsg="Could not read that file as CSV."; }
      render();
    };
    rd.onerror=()=>{ importMsg="Could not read that file."; staged=null; render(); };
    rd.readAsText(f);
  };
  pick.appendChild(fi);
  if(importMsg) pick.appendChild(el("div","note",esc(importMsg)));
  w.appendChild(pick);

  if(staged){

    const prev=el("div","card"); prev.style.marginTop="12px";
    prev.appendChild(el("h3",null,"Check before importing"));
    const kv=el("dl","kv"); kv.style.marginTop="10px";
    [["File",s.filename],["Rows found",fmt(s.records.length)],
     ["Columns recognised",s.matched.length+" of "+SCHEMA[importSet].fields.length+" known fields"],
     ["Columns not recognised",String(s.unmatched.length)]
    ].forEach(([a,c])=>{kv.appendChild(el("dt",null,esc(a))); kv.appendChild(el("dd",null,esc(c)));});
    prev.appendChild(kv);

    if(s.matched.length===0){
      prev.appendChild(el("div","banner badbox","<span><b>No columns matched.</b> This looks like an export from a different form. Check that the instrument selected above is the one this CSV came from.</span>"));
    }
    if(s.unmatched.length){
      prev.appendChild(el("div","note","Not recognised, and will be kept on the record but not analysed:"));
      const ch=el("div","chips");
      s.unmatched.slice(0,40).forEach(u=>ch.appendChild(el("span","chip bad",esc(u))));
      if(s.unmatched.length>40) ch.appendChild(el("span","chip","+"+(s.unmatched.length-40)+" more"));
      prev.appendChild(ch);
    }
    const go=el("button","btn"); go.style.marginTop="14px";
    go.textContent="Import "+s.records.length+" records";
    if(canWrite===false||!ready||importing||!s.records.length||!s.matched.length) go.disabled=true;
    const bar=el("div","prog"); const fillb=el("i"); bar.appendChild(fillb);
    const st=el("div","note"); st.id="impstat";
    go.onclick=async()=>{
      if(!db) return;
      importing=true; go.disabled=true; st.textContent="Importing…";
      let done=0, failed=0;
      for(let i=0;i<s.records.length;i++){
        const rec=Object.assign({},s.records[i],{_imported:new Date().toISOString(),_source:"kobo"});
        try{ await db.collection(importSet).doc(docIdFor(rec,i)).set(rec); done++; }
        catch(e){ failed++; }
        if(i%5===0||i===s.records.length-1){
          fillb.style.width=Math.round((i+1)/s.records.length*100)+"%";
          st.textContent="Imported "+done+" of "+s.records.length+(failed?"  ·  "+failed+" failed":"");
        }
      }
      importing=false;
      importMsg = failed
        ? done+" records imported, "+failed+" could not be saved. Check your access level and try the failed export again."
        : done+" records imported. The Indicators, Records and Analyse tabs now include them.";
      staged=null; render();
    };
    prev.appendChild(go); prev.appendChild(bar); prev.appendChild(st);
    w.appendChild(prev);
  }
  return w;
}

/* ===== RECORDS ===== */
function columnsFor(key){
  const cols=SCHEMA[key].fields.map(f=>({id:f.id,l:f.l,f}));
  const seen=new Set(cols.map(c=>c.id));
  const extra=new Set();
  store[key].forEach(r=>Object.keys(r).forEach(k=>{
    if(!seen.has(k)&&k!=="_id"&&!/^_/.test(k)) extra.add(k);
  }));
  [...extra].sort().forEach(k=>cols.push({id:k,l:k,extra:true}));
  return cols;
}
function cellText(f,v){
  if(v==null||v==="") return "—";
  if(f&&f.o&&f.o.length){
    if(f.t==="multi"){
      return String(v).split(/\s+/).map(p=>{
        const h=f.o.find(o=>String(o[0])===p); return h?h[1]:p;
      }).join(", ");
    }
    const hit=f.o.find(o=>String(o[0])===String(v)); if(hit) return hit[1];
  }
  return String(v);
}

function filtered(){
  const base=rowsOf(recordSet);
  const q=search.trim().toLowerCase();
  if(!q) return base;
  return base.filter(r=>Object.values(r).some(v=>String(v==null?"":v).toLowerCase().includes(q)));
}
function drawTable(host){
  host.innerHTML="";
  const rows=filtered();
  if(!rows.length){
    const e=el("div","empty");
    const any=store[recordSet].length;
    e.appendChild(el("b",null, any?"No match":"No "+SCHEMA[recordSet].label.toLowerCase()+" records yet"));
    e.appendChild(el("p",null, any
      ? "Nothing in this instrument matches that search or village filter."
      : "Collect in KoBo, export the CSV, then bring it in on the Import tab. Records appear here and feed the indicators automatically."));
    host.appendChild(e); return;

  const cols=columnsFor(recordSet);

  thead.appendChild(htr); t.appendChild(thead);
  const tb=el("tbody");
  rows.forEach(r=>{

    });

  host.appendChild(el("div","note",fmt(rows.length)+" of "+fmt(store[recordSet].length)+" records shown"+

/* ===== ANALYSE ===== */
function dist(key,field){
  const f=fieldMap[key][field]; if(!f) return null;
  const counts=new Map();
  rowsOf(key).forEach(r=>{
    const v=r[field]; if(v==null||v==="") return;
    counts.set(String(v),(counts.get(String(v))||0)+1);
  });
  const total=[...counts.values()].reduce((a,b)=>a+b,0);
  if(!total) return null;
  const items=(f.o||[]).map(([v,l])=>({label:l,n:counts.get(String(v))||0}))
    .filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
  return {items,total};
}
function barChart(title,cap,data,color){
  const c=el("div","chart");
  c.appendChild(el("h3",null,esc(title)));
  c.appendChild(el("div","cap",esc(cap)));
  if(!data){ c.appendChild(el("div","empty","<b>No data yet</b><p>This chart fills once household records are imported.</p>")); return c; }
  const max=Math.max(...data.items.map(i=>i.n));
  const bars=el("div","bars");
  data.items.forEach(i=>{
    const row=el("div","bar-row");
    row.appendChild(el("div","bar-lab",esc(i.label)));
    const tr=el("div","bar-track"); const fl=el("div","bar-fill");
    fl.style.width=Math.max(2,(i.n/max)*100)+"%"; fl.style.background=color;
    tr.appendChild(fl); row.appendChild(tr);
    row.appendChild(el("div","bar-val",i.n+" · "+Math.round(i.n/data.total*100)+"%"));
    bars.appendChild(row);
  });
  c.appendChild(bars);
  c.appendChild(el("div","note","n = "+data.total+" answering."));
  return c;
}

/* ===== CSV export ===== */
async function exportCsv(key){
  const cols=columnsFor(key);
  const rows=rowsOf(key);
  const q=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';
  const lines=[cols.map(c=>q(c.l)).join(",")];
  rows.forEach(r=>lines.push(cols.map(c=>q(cellText(c.f,r[c.id]))).join(",")));
  const csv="﻿"+lines.join("\r\n");
  const name="empundu-"+key+"-"+new Date().toISOString().slice(0,10)+".csv";
  const dl=await (window.claude&&window.claude.use?window.claude.use("downloads"):null);
  if(dl){ try{ await dl.save({filename:name,data:csv}); return; }catch(e){} }
  const h=document.getElementById("tablehost");
  if(h) h.appendChild(el("div","note","Download was declined or is unavailable in this view. Select the table and copy it instead."));
}

/* ===== render ===== */
function render(){
  renderNav();
  const main=document.getElementById("main");
  main.innerHTML="";
  main.appendChild(
      tab==="indicators" ? viewIndicators()
    : tab==="collect"    ? viewCollect()
    : tab==="import"     ? viewImport()
    : tab==="records"    ? viewRecords()
    : tab==="analyse"    ? viewAnalyse()
    : viewReference());
}
render();

/* ===== store ===== */
(async function connect(){
  const led=document.getElementById("led"), conn=document.getElementById("conn"), who=document.getElementById("whoami");
  if(!(window.claude&&window.claude.use)){ led.className="led off"; conn.textContent="Offline, no store"; return; }
  try{ userCap=await window.claude.use("user"); }catch(e){}
  if(userCap){
    try{ canWrite=await userCap.can("data.write"); }catch(e){}
    try{ who.textContent=(await userCap.isOwner())?"Signed in as project owner":"Signed in"; }catch(e){}
  }
  db=await window.claude.use("db");
  if(!db){ led.className="led off"; conn.textContent="Not connected"; ready=false; render(); return; }
  led.className="led on"; conn.textContent="Store connected"; ready=true;
  KEYS.forEach(k=>{
    db.collection(k).onSnapshot(
      snap=>{ store[k]=snap.docs.map(d=>Object.assign({_id:d.id},d.data())); render(); },
      err=>{ conn.textContent="Store error ("+err.code+")"; led.className="led off"; });
  });
  db.doc("meta/manual").onSnapshot(snap=>{ manual=snap.exists?(snap.data()||{}):{ambassadors:0}; render(); },()=>{});
  render();
})();
